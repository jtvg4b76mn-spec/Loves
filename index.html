}
:root[data-theme="dark"]{
  --ink:#F3E9EE; --primary:#E8798F; --primary-2:#F08FA2; --on-primary:#1B1320;
  --tint:#3A2740; --tint-2:#2B1E31; --accent:#F0906F; --purple:#B39CF5; --green:#5FD39B;

  --bg:#181119; --surface:#231A29; --text:#F3E9EE; --muted:#D0C0CC; --line:#42324A;

}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans Thai","Sarabun","Leelawadee UI",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;font-weight:500;line-height:1.75;min-height:100vh}
.wrap{max-width:680px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top,0px)) 18px calc(56px + env(safe-area-inset-bottom,0px))}
h1,h2,h3,h4{line-height:1.35;margin:0;font-family:"Mitr","Noto Sans Thai",system-ui,sans-serif;font-weight:500}
.wm,.letters span,.tc-code span,.letter .l,.brand,.tagline,.pair-title{font-family:"Mitr","Noto Sans Thai",system-ui,sans-serif;font-weight:500}
p{margin:0}

/* header */
header.top{display:flex;align-items:center;gap:10px;padding:6px 0 22px}
header.top[hidden]{display:none}
header.top .brand{min-width:0;line-height:1.25;font-weight:700;font-size:16px;letter-spacing:.2px}
.mark{display:block;flex:none}
.home-btn{margin-left:auto;display:inline-flex;align-items:center;gap:6px;appearance:none;cursor:pointer;font:inherit;font-size:14px;font-weight:600;color:var(--text);background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;min-height:40px;white-space:nowrap;flex:none;transition:background .15s,transform .12s}

@media (max-width:420px){header.top{gap:8px}header.top .brand{font-size:14px}.home-btn{padding:8px 12px;font-size:13.5px}}

/* wordmark */
.wm{font-weight:800;letter-spacing:6px}
.wm i{font-style:normal}
.wm i:nth-of-type(1){color:var(--primary)}.wm i:nth-of-type(2){color:var(--purple)}.wm i:nth-of-type(3){color:var(--accent)}.wm i:nth-of-type(4){color:var(--primary)}
.hero-logo{display:flex;flex-direction:column;align-items:center;text-align:center;padding:14px 0 4px}
.hero-logo h1{margin-top:14px}
.hero-logo .wm{display:block;font-size:clamp(46px,14vw,72px);line-height:1.1}
.hero-logo .sub{display:block;font-size:clamp(19px,5vw,24px);font-weight:600;color:var(--muted);letter-spacing:3px;margin-top:2px}
.tagline{color:var(--purple);font-weight:700;font-size:clamp(16px,4.4vw,19px);margin:12px 0 0;text-align:center}
.th-name{color:var(--muted);font-size:15px;margin:4px 0 0;text-align:center}
.purpose{margin:22px 0 0;font-size:16px}
.page-title{font-size:19px;font-weight:700;margin:0 0 14px}

/* card / buttons */
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:26px 22px}
.lead{color:var(--muted);font-size:16px;margin:10px 0 0}
.note{margin-top:18px;padding:12px 14px;border-radius:14px;background:var(--tint-2);border:1px dashed var(--line);color:var(--muted);font-size:15px}
.btn{appearance:none;border:0;cursor:pointer;font:inherit;font-weight:600;border-radius:14px;padding:13px 20px;min-height:48px;transition:transform .12s,background .15s,box-shadow .15s,opacity .15s}
.btn:active:not(:disabled){transform:scale(.98)}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-primary:hover:not(:disabled){background:var(--primary-2)}
.btn-ghost{background:transparent;color:var(--text);border:1.5px solid var(--line)}
.btn-ghost:hover:not(:disabled){background:var(--tint-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-block{width:100%}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:12px}
.start{margin-top:22px}
.stack-btns .btn+.btn{margin-top:10px}

/* quiz */
.progress-meta{display:flex;justify-content:space-between;font-size:15px;color:var(--muted);margin-bottom:8px}
.bar{height:10px;background:var(--tint);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--primary);border-radius:999px;transition:width .35s ease}
.q-card{margin-top:18px;padding:30px 22px 24px}
.q-kicker{color:var(--muted);font-size:15px;margin:0 0 8px;text-align:center}
.q-text{font-size:clamp(21px,5.4vw,27px);font-weight:700;min-height:96px;text-align:center}
.likert{margin-top:26px}
.likert-row{display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.likert-labels{align-items:end;margin-bottom:12px}
.ll{text-align:center;font-size:13.5px;font-weight:600;line-height:1.35;color:var(--muted)}
.ll.agree{color:var(--dot-agree-text)}.ll.disagree{color:var(--dot-disagree-text)}
.cell{display:flex;justify-content:center;align-items:center;height:64px}
.dot{--c:var(--muted);appearance:none;cursor:pointer;padding:0;display:grid;place-items:center;border-radius:50%;background:var(--surface);border:3px solid var(--c);transition:transform .12s,background .15s,box-shadow .15s}
.dot.agree{--c:var(--dot-agree)}.dot.disagree{--c:var(--dot-disagree)}
.dot.xl{width:50px;height:50px}.dot.l{width:40px;height:40px}.dot.m{width:32px;height:32px}
.dot svg{width:60%;height:60%;fill:none;stroke:var(--surface);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.6);transition:opacity .15s,transform .15s}
.dot:hover{background:color-mix(in srgb,var(--c) 16%,transparent);transform:scale(1.06)}
.dot[aria-checked="true"]{background:var(--c)}
.dot[aria-checked="true"] svg{opacity:1;transform:none}
@media (min-width:640px){.dot.xl{width:62px;height:62px}.dot.l{width:50px;height:50px}.dot.m{width:38px;height:38px}.cell{height:74px}.ll{font-size:15px}}
.nav{display:flex;gap:12px;margin-top:18px}
.nav .btn-primary{flex:1}
.enter{animation:slideIn .38s ease both}
@keyframes slideIn{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
.enter-back{animation:slideBack .38s ease both}
@keyframes slideBack{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}

/* processing */
.processing{text-align:center;padding:60px 10px}
.spinner{width:54px;height:54px;margin:0 auto 22px;border-radius:50%;border:5px solid var(--tint);border-top-color:var(--primary);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* gallery */
.gallery{margin-top:34px}
.gallery-head h2{font-size:clamp(22px,6vw,28px);font-weight:800}
.gallery-head p{color:var(--muted);margin:6px 0 0}
.type-card{margin-top:20px;padding:0;overflow:hidden;scroll-margin-top:16px}
.illus{aspect-ratio:10/9;background:color-mix(in srgb,var(--a) 14%,var(--surface));border-bottom:1px solid var(--line)}
.illus svg{display:block;width:100%;height:100%}
.type-card .body{padding:18px 20px 22px}
.tc-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tc-no{font-size:14px;color:var(--muted)}
.tc-code{display:inline-flex;gap:3px}
.tc-code span{display:inline-grid;place-items:center;width:26px;height:30px;border-radius:8px;background:var(--a);color:#fff;font-weight:800;font-size:15px}
.tc-code span:nth-child(even){background:color-mix(in srgb,var(--a) 16%,var(--surface));color:var(--text)}
.type-card h3{font-size:22px;font-weight:800;margin-top:10px}
.type-card .th{color:var(--purple);font-weight:600;margin-top:2px}
.type-card .d{color:var(--muted);margin:10px 0 0}
.type-card h4{font-size:15px;margin:16px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.chips li{background:var(--tint-2);border:1px solid var(--a);color:var(--text);border-radius:999px;padding:4px 12px;font-size:15px}
.gallery-note{color:var(--muted);font-size:14.5px;margin-top:16px}
.end-cta{margin-top:22px;text-align:center}

/* result */
.type-illus{display:block;width:min(280px,78%);aspect-ratio:240/260;margin:0 auto 20px;border-radius:22px;border:1px solid var(--line);background:color-mix(in srgb,var(--a) 14%,var(--surface));box-shadow:var(--shadow);overflow:hidden}
.type-illus svg{display:block;width:100%;height:100%}
.result-hero{text-align:center;padding:34px 18px 28px;background:var(--tint-2)}
.letters{display:flex;justify-content:center;gap:8px}
.letters span{display:grid;place-items:center;width:clamp(58px,17vw,84px);height:clamp(72px,21vw,104px);border-radius:18px;background:var(--a);color:#fff;font-size:clamp(38px,12vw,58px);font-weight:800;line-height:1}
.letters span:nth-child(even){background:var(--surface);color:var(--text);border:2px solid var(--a)}
.type-en{font-size:clamp(24px,6.5vw,32px);font-weight:800;margin-top:20px}
.type-th{color:var(--purple);font-weight:600;font-size:18px}
.type-desc{color:var(--muted);margin:12px auto 0;max-width:46ch}
.section{margin-top:26px}
.section h2{font-size:20px;margin-bottom:12px}
.mini-note{margin:-4px 0 12px;color:var(--muted);font-size:14.5px}
.pair{margin-bottom:20px}
.pair-title{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;margin-bottom:2px}
.pair-title small{color:var(--muted);font-weight:500;font-size:13px}
.pair-head{display:flex;justify-content:space-between;font-size:14.5px;font-weight:600;margin-bottom:6px;gap:8px}
.pair-head .r{text-align:right}
.pair-bar{display:flex;height:16px;border-radius:999px;overflow:hidden;background:var(--bar-b)}
.pair-bar i{display:block;background:var(--bar-a);transition:width .8s ease}
.pair-note{font-size:13.5px;color:var(--muted);margin-top:4px}
.info-grid{display:grid;gap:14px}
.info{border:1px solid var(--line);border-radius:18px;padding:16px 18px;background:var(--surface)}
.info h3{font-size:17px;margin-bottom:6px}
.info p{color:var(--muted)}
.info p+p{margin-top:10px}
.letter-list{display:grid;gap:12px}
.letter{display:flex;gap:14px;align-items:flex-start}
.letter .l{flex:none;width:44px;height:44px;border-radius:14px;background:var(--a);color:#fff;font-weight:800;font-size:22px;display:grid;place-items:center}
.letter b{display:block;line-height:1.4}
.letter span{display:block;font-size:14.5px;color:var(--muted);line-height:1.6}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:26px}
.actions .wide{grid-column:1/-1}
.disclaimer{margin-top:24px;font-size:14.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
.disclaimer+.disclaimer{margin-top:10px;border-top:0;padding-top:0}

/* credit */
.credit{margin-top:40px;padding-top:20px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:14.5px;line-height:1.7}
.credit p{margin:0}
.credit strong{color:var(--text)}
.credit a{color:var(--primary);text-decoration:none;font-weight:600;word-break:break-all}
.credit a:hover{text-decoration:underline}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:14.5px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:10;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .spinner{animation:none;border-top-color:var(--primary)}
}
@media (min-width:640px){
  .wrap{padding-top:40px}
  .card{padding:34px 32px}

  .actions .wide{grid-column:auto}
  .info-grid{grid-template-columns:1fr 1fr}

@media print{
  @page{margin:14mm}
  body{background:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  header.top,.actions,.nav,.toast,.gallery{display:none!important}

<script>

const DIMS=[
 {key:"conn",axis:"C",name:"Connection",full:"Relational Connection",from:0,hi:"C",lo:"B"},
 {key:"drive",axis:"E",name:"Emotional Drive",full:"Emotional Drive",from:6,hi:"E",lo:"R"},
 {key:"commit",axis:"S",name:"Commitment",full:"Relational Commitment",from:12,hi:"S",lo:"F"}
];
const TIEBREAK={

document.getElementById("topmark").innerHTML=MARK(30);
let state={screen:"intro",idx:0,answers:Array(18).fill(null),tie:{},result:null,tieAxes:[]};
let advanceTimer=null;

const allAnswered=()=>state.answers.every(v=>v!==null);
const scored=i=>REVERSE.has(i+1)?6-state.answers[i]:state.answers[i];
const dimScore=d=>{let s=0;for(let i=d.from;i<d.from+6;i++)s+=scored(i);return s};
const computeTieAxes=()=>allAnswered()?DIMS.filter(d=>dimScore(d)===18).map(d=>d.axis):[];
function letterFor(d){
 const sc=dimScore(d);
 if(sc>=19)return d.hi;
 if(sc<=17)return d.lo;
 const t=state.tie[d.axis];
 if(t>=4)return d.hi;
 if(t<=2)return d.lo;
 // tie-break answered 3: compare positive items (1st,3rd,5th) vs reverse items (2nd,4th,6th) after scoring
 let pos=0,rev=0;
 for(let k=0;k<6;k++){const v=scored(d.from+k);if(k%2===0)pos+=v;else rev+=v}
 return pos>=rev?d.hi:d.lo;
}
function getItems(){
 const items=QUESTIONS.map((q,i)=>({type:"q",i,q}));
 state.tieAxes.forEach(a=>items.push({type:"tb",axis:a}));
 return items;
}
const isAnswered=it=>it.type==="q"?state.answers[it.i]!==null:state.tie[it.axis]!=null;

function loadState(){
 const a=store.get(KEY.ans,null);
 if(Array.isArray(a)&&a.length===18)state.answers=a.map(v=>Number.isInteger(v)&&v>=1&&v<=5?v:null);
 const t=store.get(KEY.tie,{});if(t&&typeof t==="object"&&!Array.isArray(t))state.tie=t;
 state.tieAxes=computeTieAxes();
 const c=store.get(KEY.cur,0);state.idx=Number.isInteger(c)&&c>=0?c:0;
 state.idx=Math.min(state.idx,getItems().length-1);
 const r=store.get(KEY.res,null);
 if(r&&TYPES[r.code]&&r.scores)state.result=r;
 state.screen=state.result?"result":"intro";
}
function saveState(){
 store.set(KEY.ans,state.answers);store.set(KEY.tie,state.tie);store.set(KEY.cur,state.idx);
 if(state.result)store.set(KEY.res,state.result);else store.del(KEY.res);
}
function resetState(){
 clearTimeout(advanceTimer);
 state={screen:"intro",idx:0,answers:Array(18).fill(null),tie:{},result:null,tieAxes:[]};
 Object.values(KEY).forEach(store.del);
}

   นับจำนวนผู้เข้าชมและผู้ทำแบบทดสอบเสร็จด้วย GoatCounter (ไม่เก็บคำตอบ ไม่ใช้คุกกี้)

   ปล่อยเป็น "" = ปิดการนับ */
const TRACKING={goatcounter:"love-personality",visitPath:"/love-visit",completePath:"/love-completed"};
const COUNTED_KEY="lpt-completion-counted-v1";
const trackingOn=()=>!!TRACKING.goatcounter;
function pixel(path,title){
 if(!trackingOn())return;
 try{
  const img=new Image();
  img.referrerPolicy="no-referrer-when-downgrade";
  img.src="https://"+encodeURIComponent(TRACKING.goatcounter)+".goatcounter.com/count?p="+encodeURIComponent(path)+"&t="+encodeURIComponent(title)+"&rnd="+Math.random().toString(36).slice(2);
 }catch(e){}
}
function trackVisit(){pixel(TRACKING.visitPath,"Love Personality Test – visit")}
function trackCompletion(){
 if(!trackingOn())return;
 try{if(localStorage.getItem(COUNTED_KEY))return}catch(e){}
 pixel(TRACKING.completePath,"Love Personality Test – completed");
 try{localStorage.setItem(COUNTED_KEY,"1")}catch(e){}
}

 }else{
  label=`คำถามเพิ่มเติม ${state.idx-17} จาก ${state.tieAxes.length}`;
  body=`<p class="q-kicker">คะแนนของแกนนี้เท่ากัน ตอบอีกข้อเพื่อตัดสิน</p><h2 class="q-text" id="qt" data-focus>${TIEBREAK[item.axis]}</h2>${likertHTML(state.tie[item.axis],"qt")}`;
 }
 app.innerHTML=`
 <section aria-label="แบบทดสอบ">
  <h1 class="page-title">ค้นหารูปแบบความรักของคุณ</h1>
  <div class="progress-meta"><span>${label}</span><span>${pct}%</span></div>
  <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}" aria-label="ความคืบหน้า"><i style="width:${pct}%"></i></div>
  <div class="card q-card ${anim==="back"?"enter-back":anim?"enter":""}">${body}</div>
  <div class="nav">
   <button class="btn btn-ghost" data-action="back" ${state.idx===0?"disabled":""}>ย้อนกลับ</button>
   <button class="btn btn-primary" data-action="next" ${answered?"":"disabled"}>${isLast?"ดูผลลัพธ์":"ถัดไป"}</button>
  </div>
 </section>`;
 if(anim)focusHeading();
}

function renderProcessing(){
 setHeader(true);
 app.innerHTML=`<section class="card processing enter" aria-live="polite"><div class="spinner" aria-hidden="true"></div><h2 data-focus>กำลังวิเคราะห์รูปแบบความรักของคุณ…</h2><p class="lead">รอสักครู่ ผลลัพธ์กำลังจะแสดง</p></section>`;
 focusHeading();window.scrollTo({top:0});
}

function renderResult(){
 setHeader(true);
 const r=state.result,t=TYPES[r.code],letters=r.code.split("");
 const pairs=DIMS.map((d,i)=>{
  const sc=r.scores[d.key],hi=d.hi,lo=d.lo,pole=letters[i];
  const tied=sc===18;
  return `<div class="pair">
   <div class="pair-title"><span>${d.name}</span><span>${sc} / 30</span></div>
   <div class="pair-head"><span>${hi} – ${AXES[hi].name}</span><span class="r">${AXES[lo].name} – ${lo}</span></div>
   <div class="pair-bar" role="img" aria-label="${d.full} ${sc} จาก 30 คะแนน ผลคือ ${pole}"><i data-w="${(sc/36)*100}" style="width:0"></i></div>
   ${tied?`<div class="pair-note">คะแนนเท่ากัน จึงตัดสินด้วยคำถามเพิ่มเติม (ผลคือ ${pole})</div>`:""}
  </div>`}).join("");
 app.innerHTML=`
 <section class="card enter" style="padding:0;overflow:hidden;--a:${t.color}" aria-labelledby="rt">
  <div class="result-hero">
   <p class="q-kicker" style="margin:0 0 14px">ผลบุคลิกภาพความรักของคุณ<br><small>YOUR LOVE TYPE</small></p>
   <div class="type-illus">${CHARS[r.code]()}</div>
   <div class="letters" aria-hidden="true">${letters.map(l=>`<span>${l}</span>`).join("")}</div>
   <h1 class="type-en" id="rt" data-focus><span class="sr-only">${r.code} </span>${t.en}</h1>
   <div class="type-th">${t.th}</div>
   <p class="type-desc">${t.def}</p>
  </div>
  <div style="padding:6px 22px 26px">
   <div class="section">
    <h2>คะแนนของแต่ละแกน</h2>
    <p class="mini-note">คะแนนแต่ละแกนอยู่ระหว่าง 6–30 (19–30 ได้ตัวอักษรแรก, 6–17 ได้ตัวอักษรหลัง)</p>
    ${pairs}
   </div>
   <div class="section info-grid">
    <div class="info full"><h3>คุณรักแบบไหน</h3>${t.desc.map(p=>`<p>${p}</p>`).join("")}</div>
    <div class="info"><h3>เมื่อมีความรัก</h3><p>${t.love}</p></div>
    <div class="info"><h3>เมื่อเกิดความขัดแย้ง</h3><p>${t.conflict}</p></div>
    <div class="info"><h3>จุดเด่นในความสัมพันธ์</h3><ul class="chips" style="margin-top:8px">${t.strengths.map(x=>`<li style="border-color:var(--a)">${x}</li>`).join("")}</ul></div>
    <div class="info"><h3>สิ่งที่ควรระวัง</h3><p>${t.watch}</p></div>
    <div class="info full"><h3>ความหมายของตัวอักษร</h3><div class="letter-list" style="margin-top:10px">
     ${letters.map(l=>`<div class="letter"><div class="l">${l}</div><div><b>${AXES[l].name}</b><span>${AXES[l].th}</span></div></div>`).join("")}</div></div>
   </div>
   <div class="actions">
    <button class="btn btn-primary wide" data-action="restart">ทำแบบทดสอบอีกครั้ง</button>
    <button class="btn btn-ghost" data-action="copy">คัดลอกผลลัพธ์</button>
    <button class="btn btn-ghost" data-action="download">ดาวน์โหลดผลลัพธ์เป็นภาพ</button>
    <button class="btn btn-ghost" data-action="share">แชร์ผลลัพธ์</button>
    <button class="btn btn-ghost" data-action="print">พิมพ์ / บันทึกเป็น PDF</button>
   </div>
   <p class="disclaimer">แบบทดสอบนี้ใช้เพื่อสำรวจแนวโน้มด้านความรักและความสัมพันธ์ ไม่ใช่เครื่องมือวินิจฉัยทางจิตวิทยา ผลลัพธ์ไม่ควรใช้เพื่อตัดสินคุณค่าของบุคคลหรือความเหมาะสมของความสัมพันธ์เพียงอย่างเดียว</p>
   <p class="disclaimer">${PRIVACY()}</p>
  </div>
 </section>`;
 requestAnimationFrame(()=>requestAnimationFrame(()=>app.querySelectorAll(".pair-bar i").forEach(i=>i.style.width=i.dataset.w+"%")));
 focusHeading();window.scrollTo({top:0});
}

function render(anim){
 if(state.screen==="intro")renderIntro();
 else if(state.screen==="quiz")renderQuiz(anim);
 else renderResult();
}

/* -------------------------------------------------------------- ACTIONS */
function finish(){
 const scores={};DIMS.forEach(d=>scores[d.key]=dimScore(d));
 state.result={code:DIMS.map(letterFor).join(""),scores};
 state.screen="result";saveState();trackCompletion();
 renderProcessing();
 setTimeout(()=>{if(state.screen==="result")renderResult()},1800);
}
function summaryText(){
 const r=state.result,t=TYPES[r.code];
 return `ผล Love Personality Test ของฉันคือ ${r.code} · ${t.en} (${t.th})\nConnection ${r.scores.conn}/30 · Emotional Drive ${r.scores.drive}/30 · Commitment ${r.scores.commit}/30\n${location.href.split("#")[0]}`;
}
async function copyText(txt){
 try{await navigator.clipboard.writeText(txt);return true}catch(e){
  try{const ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();const ok=document.execCommand("copy");ta.remove();return ok}catch(e2){return false}
 }
}
function roundRect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function downloadImage(){
 const r=state.result,t=TYPES[r.code],W=1080,H=1500;
 const c=document.createElement("canvas");c.width=W;c.height=H;const g=c.getContext("2d");
 const font=(w,s)=>`${w} ${s}px "Noto Sans Thai",system-ui,sans-serif`;
 g.fillStyle="#FBF5EC";g.fillRect(0,0,W,H);
 g.fillStyle=t.color;g.globalAlpha=.13;g.fillRect(0,0,W,800);g.globalAlpha=1;
 g.textAlign="center";g.fillStyle="#75666A";g.font=font(600,30);g.fillText("YOUR LOVE TYPE",W/2,80);
 const finishDraw=()=>{
  const bw=150,bh=180,gap=18,x0=(W-(bw*3+gap*2))/2,y0=800;
  r.code.split("").forEach((l,i)=>{
   const x=x0+i*(bw+gap);roundRect(g,x,y0,bw,bh,30);
   if(i%2===0){g.fillStyle=t.color;g.fill();g.fillStyle="#fff"}else{g.fillStyle="#FFFCF7";g.fill();g.lineWidth=5;g.strokeStyle=t.color;g.stroke();g.fillStyle="#33252B"}
   g.font=font(800,110);g.fillText(l,x+bw/2,y0+bh/2+38);
  });
  g.fillStyle="#33252B";g.font=font(800,52);g.fillText(t.en,W/2,1060);
  g.fillStyle="#7A5BB0";g.font=font(600,40);g.fillText(t.th,W/2,1120);
  DIMS.forEach((d,i)=>{
   const y=1190+i*70,sc=r.scores[d.key];
   g.textAlign="left";g.fillStyle="#33252B";g.font=font(600,30);g.fillText(d.name,120,y);
   g.textAlign="right";g.fillText(`${sc} / 30`,W-120,y);
   roundRect(g,120,y+14,W-240,16,8);g.fillStyle="#EBCFCB";g.fill();
   roundRect(g,120,y+14,Math.max(16,(W-240)*(sc-6)/24),16,8);g.fillStyle=t.color;g.fill();
  });
  g.textAlign="center";g.fillStyle="#75666A";g.font=font(500,26);g.fillText("Love Personality Test",W/2,1450);
  c.toBlob(b=>{
   if(!b){toast("บันทึกภาพไม่สำเร็จ");return}
   const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=`love-personality-${r.code}.png`;
   document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
   toast("บันทึกภาพผลลัพธ์แล้ว");
  },"image/png");
 };
 const svgStr=CHARS[r.code]().replace("<svg ",'<svg width="600" height="650" ');
 const url=URL.createObjectURL(new Blob([svgStr],{type:"image/svg+xml"}));
 const img=new Image();
 img.onload=()=>{g.drawImage(img,(W-600)/2,110,600,650);URL.revokeObjectURL(url);finishDraw()};
 img.onerror=()=>{URL.revokeObjectURL(url);finishDraw()};
 img.src=url;
}

const actions={
 scrollTypes(){
  const el=document.getElementById("types");if(!el)return;
  const reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  el.scrollIntoView({behavior:reduce?"auto":"smooth",block:"start"});
 },
 home(){clearTimeout(advanceTimer);state.screen="intro";renderIntro();window.scrollTo({top:0})},
 start(){
  if(state.result)return actions.viewResult();
  if(state.answers.every(a=>a===null))state.idx=0;
  state.screen="quiz";
  if(state.idx>=getItems().length)state.idx=0;
  saveState();renderQuiz(true);window.scrollTo({top:0});
 },
 viewResult(){state.screen="result";renderResult()},
 restart(){resetState();state.screen="quiz";saveState();renderQuiz(true);window.scrollTo({top:0})},
 answer(btn){
  const item=getItems()[state.idx];if(!item)return;
  const v=parseInt(btn.dataset.value,10);if(!(v>=1&&v<=5))return;
  if(item.type==="q")state.answers[item.i]=v;else state.tie[item.axis]=v;
  state.tieAxes=computeTieAxes();
  saveState();renderQuiz(false);
  const dot=app.querySelector(`.dot[data-value="${v}"]`);if(dot)dot.focus({preventScroll:true});
  const items=getItems();
  if(state.idx<items.length-1){clearTimeout(advanceTimer);advanceTimer=setTimeout(()=>{if(state.screen==="quiz")actions.next()},340)}
 },
 next(){
  clearTimeout(advanceTimer);
  const items=getItems(),item=items[state.idx];
  if(!item||!isAnswered(item))return;
  if(state.idx<items.length-1){state.idx++;saveState();renderQuiz("next");window.scrollTo({top:0})}
  else finish();
 },
 back(){
  clearTimeout(advanceTimer);
  if(state.idx>0){state.idx--;saveState();renderQuiz("back")}
 },
 async copy(){toast(await copyText(summaryText())?"คัดลอกผลลัพธ์แล้ว":"คัดลอกไม่สำเร็จ")},
 download(){downloadImage()},
 async share(){
  const r=state.result,t=TYPES[r.code];
  const text=`ฉันได้ผล ${r.code} · ${t.en} (${t.th}) จาก Love Personality Test`,url=location.href.split("#")[0];
  try{if(navigator.share){await navigator.share({title:"Love Personality Test",text,url});return}}catch(e){if(e&&e.name==="AbortError")return}
  toast(await copyText(`${text}\n${url}`)?"คัดลอกข้อความสำหรับแชร์แล้ว":"แชร์ไม่สำเร็จ");
 },
 print(){window.print()}
};
document.addEventListener("click",e=>{
 const b=e.target.closest("[data-action]");
 if(b&&actions[b.dataset.action])actions[b.dataset.action](b);
});
document.addEventListener("keydown",e=>{
 if(state.screen!=="quiz"||e.metaKey||e.ctrlKey||e.altKey)return;
 if(/^[1-5]$/.test(e.key)){const d=app.querySelector(`.dot[data-value="${e.key}"]`);if(d)actions.answer(d)}
});

loadState();
render();
trackVisit();
</script>
</body>
